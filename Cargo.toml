[workspace]
resolver = "2"
members = [
    "apps/kairo-agent",
    "crates/kairo-protocol",
    "crates/kairo-transport",
    "crates/kairo-common",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rustls = "0.23"
notify = "8"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
portable-pty = "0.8"
sysinfo = "0.39"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

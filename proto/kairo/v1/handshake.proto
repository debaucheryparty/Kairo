syntax = "proto3";

package kairo.v1;

message HandshakeInit {
  uint32 protocol_version = 1;
  string client_id = 2;
  string auth_token = 3;
  int64 timestamp = 4;
}

message HandshakeAck {
  uint32 protocol_version = 1;
  string agent_id = 2;
  string session_id = 3;
  repeated string capabilities = 4;
  bool authenticated = 5;
  string error_message = 6;
}

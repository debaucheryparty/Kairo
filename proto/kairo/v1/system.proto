syntax = "proto3";

package kairo.v1;

message DockerContainer {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  string status = 5;
  int64 created_at = 6;
  repeated string ports = 7;
}

message ListContainersRequest {
  bool all = 1;
}

message ListContainersResponse {
  repeated DockerContainer containers = 1;
  bool docker_available = 2;
}

enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
}

message ManageContainerRequest {
  string container_id = 1;
  ContainerAction action = 2;
}

message ManageContainerResponse {
  bool success = 1;
  string message = 2;
}

message ContainerLogsRequest {
  string container_id = 1;
  uint32 tail = 2;
}

message ContainerLogsResponse {
  string logs = 1;
}

message SystemService {
  string name = 1;
  string description = 2;
  string load_state = 3;
  string active_state = 4;
  string sub_state = 5;
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated SystemService services = 1;
  bool systemd_available = 2;
  bool service_manager_available = 3;
  string manager_name = 4;
}

enum ServiceAction {
  SERVICE_ACTION_UNSPECIFIED = 0;
  SERVICE_ACTION_START = 1;
  SERVICE_ACTION_STOP = 2;
  SERVICE_ACTION_RESTART = 3;
}

message ManageServiceRequest {
  string service_name = 1;
  ServiceAction action = 2;
}

message ManageServiceResponse {
  bool success = 1;
  string message = 2;
}

message InstalledPackage {
  string name = 1;
  string version = 2;
  string architecture = 3;
  string description = 4;
}

message ListPackagesRequest {
  string filter = 1;
}

message ListPackagesResponse {
  repeated InstalledPackage packages = 1;
  bool package_manager_available = 2;
  string manager_name = 3;
}

message InstallPackagesRequest {
  repeated string package_names = 1;
}

message InstallPackagesResponse {
  bool success = 1;
  string message = 2;
  repeated string installed_packages = 3;
  repeated string failed_packages = 4;
}

message RemovePackagesRequest {
  repeated string package_names = 1;
}

message RemovePackagesResponse {
  bool success = 1;
  string message = 2;
  repeated string removed_packages = 3;
  repeated string failed_packages = 4;
}

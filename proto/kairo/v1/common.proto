syntax = "proto3";

package kairo.v1;

import "google/protobuf/timestamp.proto";

message KairoError {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_FOUND = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_UNAVAILABLE = 6;
  ERROR_CODE_INTERNAL = 7;
  ERROR_CODE_VERSION_MISMATCH = 8;
  ERROR_CODE_TIMEOUT = 9;
  ERROR_CODE_CANCELLED = 10;
  ERROR_CODE_CONNECTION_LOST = 11;
}

message Capability {
  string name = 1;
  bool enabled = 2;
}

syntax = "proto3";

package kairo.v1;

message CreatePtyRequest {
  string shell = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string working_directory = 4;
}

message CreatePtyResponse {
  string pty_id = 1;
}

message PtyInput {
  string pty_id = 1;
  bytes data = 2;
}

message PtyOutput {
  string pty_id = 1;
  bytes data = 2;
}

message ResizePtyRequest {
  string pty_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ClosePtyRequest {
  string pty_id = 1;
}

message PtyExited {
  string pty_id = 1;
  int32 exit_code = 2;
}

message AttachPtyRequest {
  string pty_id = 1;
}

message AttachPtyResponse {
  string pty_id = 1;
  bytes backlog = 2;
}

message ListPtysRequest {}

message PtySessionInfo {
  string pty_id = 1;
  string shell = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message ListPtysResponse {
  repeated PtySessionInfo sessions = 1;
}

